<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Annoying Uncle Punch 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>

:root {

  color-scheme: light;
}

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); pointer-events: none;
}
#hud[hidden] { display: none; }
#hud .pill { pointer-events: auto; }

#counts { display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; font-variant-numeric: tabular-nums; line-height: 1.25; }
#counts b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 0; }
.pill { appearance: none; border: 0; cursor: pointer; font-family: var(--display); font-size: 16px; color: var(--ink); background: var(--card); padding: 8px 14px; border-radius: 999px; min-height: 40px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
#overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-block: 16px; overflow: auto; background: rgba(24,14,36,.55);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

.card { width: min(100%, 440px); box-sizing: border-box; background: var(--card); border-radius: 22px; padding: 22px 20px; box-shadow: 0 8px 0 rgba(0,0,0,.28); display: flex; flex-direction: column; gap: 14px; margin: auto; }
.card h1, .card h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
.card h1 { font-size: 44px; color: var(--pink); text-shadow: 0 3px 0 rgba(43,29,46,.14); }
.card h2 { font-size: 34px; }
.card p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tile { appearance: none; border: 0; cursor: pointer; color: #fff; background: var(--teal); border-radius: 12px; padding: 8px 2px 6px; box-shadow: 0 3px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; }
.tile .n { font-family: var(--display); font-size: 22px; line-height: 1; }
.tile .st { font-size: 11px; color: var(--gold); text-shadow: 0 1px 0 rgba(0,0,0,.3); line-height: 1; }
.tile.cur { background: var(--pink); }
.tile[disabled] { background: var(--lock); cursor: not-allowed; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.btn { appearance: none; border: 0; cursor: pointer; font-family: var(--display); font-size: 24px; color: #fff; background: var(--pink); padding: 12px 18px; border-radius: 16px; min-height: 52px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.btn.alt { background: var(--teal); } .btn.ghost { background: #eadfcb; color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row .btn { flex: 1 1 120px; }
.nav { align-items: center; flex-wrap: nowrap; } .nav .btn { flex: 0 0 56px; padding: 6px; } .nav .big { flex: 1; }
.jump input { flex: 2 1 140px; min-width: 0; box-sizing: border-box; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 14px; border: 3px solid #d9ccb7; background: #fff; color: var(--ink); }

.rules { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }

.stars .off { color: #d9ccb7; }
.big { font-family: var(--display); font-size: 20px; text-align: center; }
</style>

</head><body>


<div id="stage"></div>

  <button class="pill" id="menuBtn" type="button">Menu</button>
  <div id="lvlName"></div>

</div>

<div id="overlay"></div>

  }
  function updateUncle(u, dt, tm) {
    u.t0 += dt;
    if (u.state === 'ko') {
      u.koT += dt; u.root.position.addScaledVector(u.kv, dt); u.root.rotation.x += u.spin.x * dt; u.root.rotation.y += u.spin.y * dt; u.root.rotation.z += u.spin.z * dt;

  }

  function poseUncle(u, tm) {
    var P = u.parts, r = u.root, ph = u.phase, st = u.state, ko = st === 'ko', s = u.s;
    var legA = [0, 0], legK = [0, 0], armZ = [-.14, .14], armX = [0, 0], armE = [0, 0], lean = 0, hop = 0, hip = 0, headZ = 0, talk = false, mood = 'smug', torsoZ = 0;
    var yaw = 0;

    } else if (st === 'stun') {

      case 'sit': hip = -.45; legA = [-1.5, -1.5]; legK = [1.5, 1.5]; armX = [-.5, -1.2 + Math.sin(tm / 600) * .08]; armE = [-.5, -.8]; armZ = [-.1, .1]; mood = Math.sin(tm / 1400 + u.t0) > .5 ? 'talk' : 'smug'; break;
      case 'run': var s1 = Math.sin(ph); legA = [-s1 * .95, s1 * .95]; legK = [.35 + Math.max(0, s1) * .9, .35 + Math.max(0, -s1) * .9]; armX = [s1 * .9, -s1 * .9]; armE = [-.9, -.9]; armZ = [-.1, .1]; lean = .2; hop = Math.abs(Math.cos(ph)) * .1; mood = 'talk'; yaw = u.dir * Math.PI / 2; break;
      case 'dance': var d = Math.sin(ph); legA = [-d * .4, d * .4]; legK = [Math.max(0, d) * .6, Math.max(0, -d) * .6]; armZ = [-(2.5 + Math.sin(ph * 2) * .5), 2.5 - Math.sin(ph * 2) * .5]; torsoZ = d * .15; hop = Math.abs(d) * .25; headZ = d * .2; mood = 'talk'; break;
      case 'jump': var air = u.y - u.base > .7; legA = air ? [-.9, -.5] : [0, 0]; legK = air ? [1.3, 1.1] : [0, 0]; armZ = [-2.7, 2.7]; mood = 'talk'; break;

      else if (u.t === 'peek') { r.position.set(u.x, u.y, u.z); r.scale.set(s, s * (.4 + .6 * u.peekP), s); r.visible = u.peekP > .02; }

    if (u.t === 'jump') u.props.position.set(u.x, u.base, u.z);
  }

  /* ---------- input / aiming ---------- */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function aimFrom(e) {
    var r = cvs.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1));
    ray.setFromCamera(ndc, camera); var o = ray.ray.origin, d = ray.ray.direction;

  }

  cvs.addEventListener('pointermove', function (e) { if (G && G.aiming) G.aimTarget = aimFrom(e); });

  function fire(dir) {

    G.ammo--; G.used++; G.recoil = .16; sFire();
    var m = makeGlove(1); var p = LAUNCH.clone().addScaledVector(dir, 1.9); m.position.copy(p); glovesG.add(m);

  }
  function updateAimDots() {

    if (!on) { dots.forEach(function (d) { d.visible = false; }); return; }
    var dir = dirTo(G.aimTarget), p = LAUNCH.clone().addScaledVector(dir, 1.9), v = dir.clone().multiplyScalar(SPEED), dt = .05;
    for (var i = 0; i < dots.length; i++) { p.addScaledVector(v, dt); v.y -= GRAV * dt; if (p.x < -WALL) { p.x = -WALL; v.x = Math.abs(v.x); } else if (p.x > WALL) { p.x = WALL; v.x = -Math.abs(v.x); } dots[i].position.copy(p); dots[i].visible = p.z > -13 && p.y > .2; dots[i].material.opacity = 1 - i / dots.length; var sc3 = 1 - i * .03; dots[i].scale.setScalar(sc3); }
  }

  /* ---------- screens ---------- */
  function show(html) { ov.innerHTML = html; ov.hidden = false; }
  function hide() { ov.hidden = true; ov.innerHTML = ''; }
  function starStr(n) { var s = ''; for (var i = 0; i < 3; i++) s += i < n ? '★' : '<span class="off">★</span>'; return s; }
  var PAGE = null;
  function highest() { var h = -1; Object.keys(save.stars).forEach(function (k) { if ((save.stars[k] || 0) > 0 && +k > h) h = +k; }); return h; }
  function menu() {
    if (G) G.running = false; $('hud').hidden = true;

    }
